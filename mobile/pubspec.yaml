name: mandi_mitra_mobile
description: "RythuMitra - Smart agricultural marketplace for farmers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.1
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  shared_preferences: ^2.2.3
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  url_launcher: ^6.3.0
  intl: ^0.19.0
  showcaseview: ^5.1.0
  permission_handler: 12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
